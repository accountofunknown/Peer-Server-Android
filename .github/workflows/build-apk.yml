name: Build Peer Server APK from ZIP

on:
  workflow_dispatch:          # manual run
  push:
    branches: [main, master]
    paths:
      - 'Peer-Server-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project from ZIP
        run: |
          if [ ! -f Peer-Server-Android.zip ]; then
            echo "ERROR: Peer-Server-Android.zip not found in repository root"
            exit 1
          fi
          mkdir -p project
          unzip -o Peer-Server-Android.zip -d project
          echo "Extracted contents:"
          find project -type f | head -30

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install dependencies & prepare Cordova
        working-directory: project
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          npm install
          npm install --prefix www/nodejs-project --omit=dev
          npx cordova plugin add nodejs-mobile-cordova
          npx cordova platform add android@latest

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peer-Server-debug-APK
          path: project/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
