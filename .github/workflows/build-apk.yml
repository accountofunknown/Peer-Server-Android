name: Build Peer Server APK

on:
workflow_dispatch:
push:
branches: [main, master]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Extract project ZIP
    run: |
      ZIP_FILE="Peer-Server-Android.zip"
      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: $ZIP_FILE not found in repository root."
        exit 1
      fi
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      if [ -f extracted/package.json ]; then
        PROJECT_DIR="extracted"
      else
        PROJECT_DIR=$(find extracted -mindepth 2 -name package.json \
          -not -path '*/node_modules/*' -print -quit | xargs -r dirname)
      fi

      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
        echo "ERROR: Could not find the Cordova project in the ZIP."
        find extracted -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Install project dependencies
    run: |
      cd "$PROJECT_DIR"
      npm install
      npm run check

  - name: Install PeerServer runtime dependencies
    run: |
      cd "$PROJECT_DIR"
      npm install --prefix www/nodejs-project --omit=dev

  - name: Prepare Cordova Android
    run: |
      cd "$PROJECT_DIR"
      npx cordova plugin add nodejs-mobile-cordova
      npx cordova platform add android@latest

  - name: Build debug APK
    run: |
      cd "$PROJECT_DIR"
      npx cordova build android --debug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Peer-Server-debug-APK
      path: ${{ env.PROJECT_DIR }}/platforms/android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
