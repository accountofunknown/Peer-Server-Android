name: Build Peer Server APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Peer-Server-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project from ZIP
        run: |
          set -e
          if [ ! -f Peer-Server-Android.zip ]; then
            echo "ERROR: Peer-Server-Android.zip not found in repo root"
            ls -la
            exit 1
          fi
          mkdir -p project
          unzip -o Peer-Server-Android.zip -d project
          echo "=== Project tree ==="
          find project -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          # Use the Gradle installed by setup-gradle action
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peer-Server-debug-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
