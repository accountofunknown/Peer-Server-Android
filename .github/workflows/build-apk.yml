name: Build Peer Server APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner."
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Peer-Server-Android.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload the ZIP file to the root of the repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          if [ -f extracted/package.json ] && [ -f extracted/config.xml ]; then
            PROJECT_DIR="extracted"
          else
            PROJECT_DIR=""

            while IFS= read -r file; do
              dir="$(dirname "$file")"
              if [ -f "$dir/config.xml" ] && [ -f "$dir/www/index.html" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(find extracted -name package.json \
              -not -path '*/node_modules/*' -print)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Cordova project files were not found in the ZIP."
              find extracted -maxdepth 5 -type f | head -100
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project in: $PROJECT_DIR"

      - name: Install project dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run check

      - name: Install PeerJS runtime dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --prefix www/nodejs-project --omit=dev

      - name: Prepare Android project
        run: |
          cd "$PROJECT_DIR"
          npx cordova plugin add nodejs-mobile-cordova
          npx cordova platform add android@latest

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd "$PROJECT_DIR"
          npx cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peer-Server-debug-APK
          path: ${{ env.PROJECT_DIR }}/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
