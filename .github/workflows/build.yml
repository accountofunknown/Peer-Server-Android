name: Build Peer Server APK

# Upload PeerServer.zip (the project) to the repo root together with this file at
# .github/workflows/build.yml. Every push to main/master (or a manual run) unpacks the zip
# and builds a signed release APK, published as the "PeerServer-apk" artifact of the run.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project zip
        shell: bash
        run: |
          ZIP=$(ls -1 PeerServer*.zip peerserver*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in the repository root"; exit 1; fi
          echo "Using $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "::error::settings.gradle not found inside $ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "Using signing key from repository secrets"
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"; KEYPASS="${KS_KEYPASS:-$KS_PASS}"
          else
            echo "No signing secrets set: generating a throw-away key (updates will need uninstall/reinstall)"
            PASS=$(openssl rand -hex 12); ALIAS=peerserver; KEYPASS="$PASS"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$KEYPASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Peer Server, O=Peer Server" > /dev/null
          fi
          echo "::add-mask::$PASS"
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify and collect APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::APK not produced"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/apksigner" verify --print-certs "$APK" || true
          "$BT/aapt" dump badging "$APK" 2>/dev/null | head -n 3 || true
          mkdir -p out
          cp "$APK" out/PeerServer.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PeerServer-apk
          path: out/PeerServer.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
